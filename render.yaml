services:
  - type: web
    name: void-music
    runtime: python
    plan: free
    # Nothing to install: the player has no dependencies and neither does its
    # server. Both are the standard library and nothing else.
    buildCommand: ""
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Locks the deployment so only you can use it. Set a value in the
      # Render dashboard; leave it unset and anyone who learns the URL can
      # stream through your server on your bandwidth.
      - key: ACCESS_CODE
        sync: false
      # Optional: an HTTP(S) proxy to send upstream traffic through, for when
      # the host's own IP is the thing being blocked or rate-limited.
      - key: UPSTREAM_PROXY
        sync: false
      # Optional: extra hosts this server may fetch, comma-separated. Use it
      # to point at your own Archive mirror.
      - key: ALLOWED_HOSTS
        sync: false
