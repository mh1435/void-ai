<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Void Legends — 5v5 MOBA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23a855f7'/%3E%3Cpath d='M9 23 23 9M15 10l7 7' stroke='%230b1220' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ================= HERO SELECT ================= -->
  <div id="hero-select" class="overlay">
    <h1 class="logo">VOID <span>LEGENDS</span></h1>
    <p class="tagline">Pick your hero. Push the lanes. Shatter the enemy core.</p>
    <div id="hero-grid"></div>
    <button id="btn-start" disabled>PICK YOUR HERO</button>
    <p class="controls-hint">
      Move: WASD / joystick &nbsp;·&nbsp; Attack: Space / ⚔ &nbsp;·&nbsp; Skills: Q E R / buttons<br>
      Recall: B &nbsp;·&nbsp; Shop: P &nbsp;·&nbsp; Scoreboard: Tab
    </p>
  </div>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hidden">
    <!-- top bar -->
    <div id="topbar">
      <span id="hud-kills">0 — 0</span>
      <span id="hud-time">0:00</span>
    </div>

    <!-- minimap -->
    <canvas id="minimap" width="170" height="170"></canvas>

    <!-- kill feed -->
    <div id="killfeed"></div>

    <!-- flash messages -->
    <div id="flash-area"></div>

    <!-- player status -->
    <div id="status-panel">
      <div class="status-row">
        <span id="hud-level" class="level-badge">1</span>
        <div class="bars">
          <div class="bar hp"><div id="bar-hp"></div><span id="bar-hp-text"></span></div>
          <div class="bar mana"><div id="bar-mana"></div></div>
          <div class="bar xp"><div id="bar-xp"></div></div>
        </div>
      </div>
      <div class="status-row2">
        <span class="gold-chip">🪙 <span id="hud-gold">0</span></span>
        <span class="kda-chip" id="hud-kda">0/0/0</span>
        <span id="item-strip"></span>
      </div>
    </div>

    <!-- left utility buttons -->
    <div id="util-btns">
      <button id="btn-shop" class="util-btn">🛒</button>
      <button id="btn-score" class="util-btn">📊</button>
      <button id="btn-recall" class="util-btn">⛺</button>
    </div>

    <!-- joystick -->
    <div id="joy-zone"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>

    <!-- skill cluster -->
    <div id="skill-cluster">
      <button id="btn-attack" class="atk-btn">⚔</button>
      <button id="btn-s1" class="skill-btn"><span class="sk-key">Q</span><span class="sk-name"></span><span class="sk-cd"></span></button>
      <button id="btn-s2" class="skill-btn"><span class="sk-key">E</span><span class="sk-name"></span><span class="sk-cd"></span></button>
      <button id="btn-ult" class="skill-btn ult"><span class="sk-key">R</span><span class="sk-name"></span><span class="sk-cd"></span></button>
    </div>

    <!-- respawn -->
    <div id="respawn-overlay" class="hidden">
      <div class="respawn-box">
        <div>RESPAWNING IN</div>
        <div id="respawn-timer">5</div>
      </div>
    </div>

    <!-- shop -->
    <div id="shop" class="panel hidden">
      <div class="panel-head">ITEM SHOP <button id="shop-close" class="panel-x">✕</button></div>
      <div id="shop-items"></div>
    </div>

    <!-- scoreboard -->
    <div id="scoreboard" class="panel hidden">
      <div class="panel-head">SCOREBOARD <button id="score-close" class="panel-x">✕</button></div>
      <div id="score-body"></div>
    </div>
  </div>

  <!-- ================= END SCREEN ================= -->
  <div id="end-screen" class="overlay hidden">
    <h1 id="end-title">VICTORY</h1>
    <p id="end-stats"></p>
    <button id="btn-again">PLAY AGAIN</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
