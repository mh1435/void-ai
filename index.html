<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Void Music</title>
<meta name="description" content="A fast, offline-first music player for open-licensed catalogues. No account, no ads, no region locks.">
<meta name="theme-color" content="#0b0a13">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#view">Skip to content</a>

<div class="app">

  <!-- ── Sidebar (desktop) ───────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/icon-192.png" alt="" width="34" height="34" class="brand-mark">
      <div class="brand-text">
        <strong>Void</strong>
        <span>Music</span>
      </div>
    </div>

    <nav class="nav" aria-label="Main">
      <a href="#/home"    data-nav="home"    class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/search"  data-nav="search"  class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg>
        <span>Search</span>
      </a>
      <a href="#/library" data-nav="library" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h3v18H4zm5.5 0h3v18h-3zM15 4.2l2.9-.78 4.66 17.38-2.9.78z"/></svg>
        <span>Library</span>
      </a>
      <a href="#/settings" data-nav="settings" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4"/><path d="m10.4 2 -.5 2.4a8 8 0 0 0-1.6.93l-2.3-.8-1.6 2.77 1.8 1.63a8 8 0 0 0 0 1.85l-1.8 1.63 1.6 2.77 2.3-.8q.74.56 1.6.93l.5 2.4h3.2l.5-2.4q.86-.37 1.6-.93l2.3.8 1.6-2.77-1.8-1.63a8 8 0 0 0 0-1.85l1.8-1.63-1.6-2.77-2.3.8a8 8 0 0 0-1.6-.93L13.6 2z" opacity=".55"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <button class="chip" id="net-chip" type="button" title="Connection status — click for details">
        <span class="dot" id="net-dot"></span>
        <span id="net-label">Checking…</span>
      </button>
      <button class="btn-ghost install-btn" id="install-btn" hidden type="button">Install app</button>
    </div>
  </aside>

  <!-- ── Main column ─────────────────────────────────────────────────── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-nav">
        <button class="icon-btn" id="back-btn" type="button" aria-label="Go back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 14 3.2 5.2 12l8.8 8.8 1.4-1.4L8 12z"/></svg>
        </button>
      </div>
      <form class="search-form" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg>
        <input type="search" id="search-input" placeholder="Search songs, artists, concerts…"
               autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search music">
        <button type="button" class="clear-btn" id="search-clear" hidden aria-label="Clear search">&times;</button>
      </form>
      <div class="topbar-end">
        <button class="icon-btn" id="mini-net" type="button" aria-label="Connection status">
          <span class="dot" id="net-dot-mini"></span>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- ── Now-playing bar ─────────────────────────────────────────────── -->
  <footer class="playbar" id="playbar" data-empty="true">
    <div class="pb-seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
    </div>

    <div class="pb-body">
      <div class="pb-track">
        <div class="pb-art" id="pb-art"><span class="art-fallback">♪</span></div>
        <div class="pb-meta">
          <div class="pb-title" id="pb-title">Nothing playing</div>
          <div class="pb-artist" id="pb-artist">Pick something to start</div>
        </div>
        <button class="icon-btn like-btn" id="pb-like" type="button" aria-label="Save to Liked" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-9.6-9.1C.6 8.3 2.6 4.5 6.2 4.5c2 0 3.3 1.1 4 2.1l1.8 2.3 1.8-2.3c.7-1 2-2.1 4-2.1 3.6 0 5.6 3.8 3.8 7.4C19.5 16.1 12 21 12 21"/></svg>
        </button>
      </div>

      <div class="pb-controls">
        <button class="icon-btn" id="btn-shuffle" type="button" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-2.2l-2.3 3-1.2-1.6L13.7 6H21V6zM3 6h4.3l7.5 10H21v2h-6.9L6.6 8H3zM17 13l4 4-4 4v-3h-3.3l-1.7-2.3 1.2-1.6L14.8 16H17z"/></svg>
        </button>
        <button class="icon-btn" id="btn-prev" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg>
        </button>
        <button class="play-btn" id="btn-play" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" class="i-play" aria-hidden="true"><path d="M8 5.1v13.8L19 12z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause" aria-hidden="true"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>
          <svg viewBox="0 0 24 24" class="i-load" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-2.5A6.5 6.5 0 1 1 12 5.5z"/></svg>
        </button>
        <button class="icon-btn" id="btn-next" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg>
        </button>
        <button class="icon-btn" id="btn-repeat" type="button" aria-label="Repeat off" data-mode="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          <span class="repeat-one" aria-hidden="true">1</span>
        </button>
      </div>

      <div class="pb-extras">
        <span class="pb-time"><span id="t-cur">0:00</span> <i>/</i> <span id="t-dur">0:00</span></span>
        <button class="icon-btn" id="btn-queue" type="button" aria-label="Queue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-8.5 5 3.5-5 3.5z"/></svg>
        </button>
        <div class="vol">
          <button class="icon-btn" id="btn-mute" type="button" aria-label="Mute">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.5L12 4.8v14.4L7.5 15H4z"/><path id="vol-waves" d="M15 8.6a4.6 4.6 0 0 1 0 6.8l1.4 1.4a6.6 6.6 0 0 0 0-9.6zm2.6-2.8a8.5 8.5 0 0 1 0 12.4l1.4 1.4a10.5 10.5 0 0 0 0-15.2z"/></svg>
          </button>
          <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
        </div>
      </div>
    </div>
  </footer>

  <!-- ── Mobile tab bar ──────────────────────────────────────────────── -->
  <nav class="tabbar" aria-label="Main">
    <a href="#/home"     data-nav="home"     class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#/search"   data-nav="search"   class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg><span>Search</span></a>
    <a href="#/library"  data-nav="library"  class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h3v18H4zm5.5 0h3v18h-3zM15 4.2l2.9-.78 4.66 17.38-2.9.78z"/></svg><span>Library</span></a>
    <a href="#/settings" data-nav="settings" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4"/><path d="m10.4 2 -.5 2.4a8 8 0 0 0-1.6.93l-2.3-.8-1.6 2.77 1.8 1.63a8 8 0 0 0 0 1.85l-1.8 1.63 1.6 2.77 2.3-.8q.74.56 1.6.93l.5 2.4h3.2l.5-2.4q.86-.37 1.6-.93l2.3.8 1.6-2.77-1.8-1.63a8 8 0 0 0 0-1.85l1.8-1.63-1.6-2.77-2.3.8a8 8 0 0 0-1.6-.93L13.6 2z" opacity=".55"/></svg><span>Settings</span></a>
  </nav>

  <!-- ── Queue drawer ────────────────────────────────────────────────── -->
  <div class="drawer" id="queue-drawer" hidden>
    <div class="drawer-head">
      <h2>Queue</h2>
      <div class="drawer-actions">
        <button class="btn-ghost" id="queue-clear" type="button">Clear</button>
        <button class="icon-btn" id="queue-close" type="button" aria-label="Close queue">&times;</button>
      </div>
    </div>
    <div class="drawer-body" id="queue-list"></div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="toasts" id="toasts" aria-live="polite" role="status"></div>

<script type="module" src="js/main.js"></script>
<noscript>
  <p style="padding:2rem;color:#e8e6f5;font:16px system-ui">
    Void Music needs JavaScript to play audio. Please enable it.
  </p>
</noscript>
</body>
</html>
