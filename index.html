<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Void Arena — 5v5 MOBA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ============ HERO SELECT ============ -->
<div id="select">
  <div class="selBox">
    <h1 class="logo">VOID <span>ARENA</span></h1>
    <p class="tagline">5v5 lane battle · destroy the enemy Void Core</p>
    <div id="heroGrid"></div>
    <div id="selInfo"></div>
    <button id="btnStart">ENTER THE ARENA</button>
    <p class="hint">Mobile: joystick + tap/drag skill buttons &nbsp;·&nbsp; Desktop: WASD move, 1/2/3 skills (aim with mouse), Space attack, B recall, F quick-buy, P shop, Tab score</p>
  </div>
</div>

<!-- ============ IN-GAME HUD ============ -->
<div id="lowHp"></div>
<div id="hud">

  <div id="topbar">
    <span class="tKills blue"><i></i><b id="topBlue">0</b></span>
    <span id="topTimer">0:00</span>
    <span class="tKills red"><b id="topRed">0</b><i></i></span>
  </div>

  <div id="statsMini">
    <span class="gold">◆ <b id="goldVal">0</b></span>
    <span class="kda"><b id="kdaVal">0/0/0</b></span>
    <span class="cs">CS <b id="csVal">0</b></span>
  </div>

  <canvas id="minimap" width="160" height="160"></canvas>

  <div id="announce"></div>
  <div id="killfeed"></div>

  <!-- portrait + bars -->
  <div id="portrait">
    <div class="portWrap">
      <canvas id="portGlyph" width="64" height="64"></canvas>
      <span id="lvlBadge">1</span>
    </div>
    <div class="bars">
      <div class="bar hp"><div id="hpFill"></div></div>
      <div class="bar mp"><div id="mpFill"></div></div>
      <div class="bar xp"><div id="xpFill"></div></div>
    </div>
    <div id="itemsRow"></div>
  </div>

  <!-- joystick -->
  <div id="joyZone">
    <div id="joyBase"><div id="joyKnob"></div></div>
  </div>

  <!-- action cluster -->
  <div id="actions">
    <div class="miniRow">
      <div id="btnRecall" class="miniBtn">⌂</div>
      <div id="btnBuy" class="miniBtn buy"></div>
      <div id="btnShop" class="miniBtn">🛒</div>
      <div id="btnScore" class="miniBtn">☰</div>
    </div>
    <div class="mainRow">
      <div id="skills"></div>
      <div id="btnAttack"><span>⚔</span></div>
    </div>
  </div>

  <!-- shop -->
  <div id="shopPanel">
    <div class="shopHead">
      <h3>Armory</h3><span id="shopGold"></span><button id="btnCloseShop">✕</button>
    </div>
    <div id="shopGrid"></div>
  </div>

  <div id="scoreboard"></div>

  <div id="deathOverlay">
    <div>
      <h2>SLAIN</h2>
      <p>Respawn in <b id="deathTimer">5</b></p>
    </div>
  </div>

</div>

<!-- ============ END SCREEN ============ -->
<div id="end">
  <h1 id="endTitle">VICTORY</h1>
  <button id="btnRestart">PLAY AGAIN</button>
</div>

<script src="js/data.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
