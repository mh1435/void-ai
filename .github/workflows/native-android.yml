name: Build Native APK

on:
  push:
    branches: ['**']
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'native-android/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a release with this tag (e.g. native-v1.0.0). Leave blank to only build the APK.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Assemble native APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No committed Gradle wrapper for this module: the wrapper jar is a
      # binary this session cannot generate without running `gradle wrapper`
      # somewhere with Gradle already installed. setup-gradle provisions a
      # real Gradle distribution directly instead, which needs no wrapper
      # jar in the repo at all — the honest option given that constraint,
      # not a placeholder pretending the wrapper exists.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: native-android
        run: gradle --no-daemon assembleRelease

      - name: Name the artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-android/app/build/outputs/apk/release/app-release.apk \
             "dist/void-music-native-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: void-music-native-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach signed APK to release
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release_version != ''

    env:
      TAG: ${{ inputs.release_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: native-android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/void.keystore"
            gradle --no-daemon assembleRelease \
              -PVOID_KEYSTORE="$RUNNER_TEMP/void.keystore" \
              -PVOID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -PVOID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -PVOID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            gradle --no-daemon assembleRelease
          fi

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-android/app/build/outputs/apk/release/app-release.apk "dist/void-music-native-${TAG}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Void Music Native ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Native Kotlin/Compose build of Void Music (parallel to the WebView
            release under android.yml — this one has no shared build history
            with it, so it starts its own version numbering).
