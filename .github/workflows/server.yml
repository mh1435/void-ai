name: Server

on:
  push:
    branches: ["**"]
    paths: ["loop/**", "server.py", "tests/**", "web/**", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is what Render installs by default when PYTHON_VERSION is
        # unset, so it needs to be covered whether or not it is pinned.
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The server runs on the standard library alone; PyNaCl and cryptography
      # are optional extras that enable encrypted password login. Install them
      # so the encryption round-trip is exercised, not just the fallback.
      - name: Install optional crypto extras
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Unit tests without the optional extras
        run: |
          pip uninstall -y PyNaCl cryptography
          python3 -m unittest discover -s tests -v
