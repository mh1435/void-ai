name: Server

on:
  push:
    branches: ["**"]
    paths: ["loop/**", "server.py", "tests/**", "web/**", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install: the server is standard library only, and
      # this job is what keeps it that way.
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
