name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a release with this tag (e.g. v1.0.0). Leave blank to only build the APK.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The web app is copied into the APK at build time rather than committed
      # twice, so a silent failure of that step would ship an empty shell.
      - name: Verify the web app was bundled
        working-directory: android
        run: |
          set -euo pipefail
          bundled="app/build/generated/webAssets/www"
          for f in index.html sw.js manifest.webmanifest css/app.css js/main.js js/player.js assets/icon-192.png; do
            test -s "$bundled/$f" || { echo "::error::missing $f in bundled assets"; exit 1; }
          done
          echo "bundled $(find "$bundled" -type f | wc -l) files"

      - name: Name the artifact
        id: rename
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/void-music-${GITHUB_REF_NAME//\//-}-debug.apk"
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: void-music-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach signed APK to release
    runs-on: ubuntu-latest
    needs: build
    # Either a v* tag was pushed, or someone dispatched the workflow and asked
    # for a version. The dispatch path lets the runner's own token create the
    # tag, which is useful when the caller cannot push tags directly.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')

    env:
      TAG: ${{ inputs.release_version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # A release build is only signable when a keystore is configured. Without
      # one we fall back to publishing the debug-signed APK, which still
      # installs — it just cannot be upgraded in place by a later signed build.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/void.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; publishing the debug-signed APK instead."
          fi

      - name: Build release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PVOID_KEYSTORE="$RUNNER_TEMP/void.keystore" \
            -PVOID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PVOID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PVOID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build debug APK
        if: steps.keystore.outputs.present != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/void-music-${TAG}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/void-music-${TAG}-debug.apk"
          fi
          ls -lh dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not already exist.
          tag_name: ${{ env.TAG }}
          name: Void Music ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Sideloadable Android build of Void Music.

            Download the `.apk` below, copy it to your phone and open it. Android
            will ask you to allow installing from that source. No Play Store and
            no account needed.

            This build is debug-signed unless repository signing secrets are
            configured, which is what makes it installable with no setup.
