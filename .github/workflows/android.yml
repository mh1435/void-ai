name: Android

on:
  push:
    branches: ["**"]
    paths: ["android/**", "tools/gen_fixtures.py", "loop/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tools/gen_fixtures.py", "loop/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The core module's fixtures are generated from the Python normalisers.
      # Regenerating them here means a server-side shape change fails the
      # Android build rather than silently drifting out of sync.
      - name: Regenerate API fixtures from the server
        run: python3 tools/gen_fixtures.py

      - name: Fail if fixtures are stale
        run: |
          if ! git diff --quiet -- android/core/src/test/resources; then
            echo "::error::Committed fixtures do not match loop/instagram.py."
            echo "Run: python3 tools/gen_fixtures.py, then commit the result."
            git diff --stat -- android/core/src/test/resources
            exit 1
          fi

      - name: Core unit tests (contract with the server)
        working-directory: android
        run: ./gradlew :core:test --console=plain

      # Gradle's stack traces are hundreds of lines and push the actual
      # "e: file:...: error:" lines out of view. Capture the log and re-print
      # just the compiler diagnostics at the end, where they are findable.
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build-debug.log || {
            echo "::group::Compiler diagnostics"
            grep -E "^e: |^w: |: error:" build-debug.log | head -120 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build-release.log || {
            echo "::group::Compiler diagnostics"
            grep -E "^e: |^w: |: error:" build-release.log | head -120 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loop-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: ignore
